name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e ".[test]"

      - name: Test
        run: python -m pytest -q

      - name: Replay validation
        run: python -m context_enrichment validate --scenarios fixtures/scenarios

      - name: Demonstration layer validation
        run: python -m context_enrichment demo-validate
